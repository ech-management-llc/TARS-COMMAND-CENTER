<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="description" content="TARS Command Center — a tile-based operations command center. Platform v1.">
<title>TARS Command Center</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <!-- Source-of-data ribbon (built from the registry's source tags) -->
  <div class="verbar" id="verbar"></div>

  <!-- Global AI employee — pinned at the top -->
  <button class="tarsbtn" id="tars-btn" type="button"></button>

  <!-- Header (tenant title + when) -->
  <div class="head" id="head"></div>

  <!-- AI summary (static for v1 — honest, not a live model call) -->
  <div class="ai" id="ai-summary"></div>

  <!-- Live dot + updated + refresh -->
  <div class="upd" id="updbar">
    <div class="live"><span class="pulse"></span> <span id="live-label">Live</span></div>
    <button class="aibtn" id="refresh-btn" type="button">↻ REFRESH</button>
  </div>

  <!-- Home — all groups + tiles render here from config/layers.json -->
  <main id="home" aria-live="polite"></main>

  <div class="foot" id="foot"></div>
</div>

<!-- Drill-in overlay (artifact of the same name loads here) -->
<div class="ov" id="ov"><div class="panel" id="panel"></div></div>

<!-- Global TARS chat overlay -->
<div class="ov" id="gov"><div class="panel" id="gpanel" style="min-height:auto"></div></div>

<script src="agents.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
