<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="description" content="Foundation Layer — Command Center (FL CC). A tile-based real-estate operations command center.">
<title>Foundation Layer — Command Center</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<style>
  /* Phase 2 — first-run locked board + flashing "Set up with TARS" entry */
  .grp-locked { opacity:.5; filter:grayscale(1); }
  .grp-locked .grp-head { cursor:default; }
  .grp-toggle-locked { display:flex; align-items:center; gap:8px; width:100%; background:transparent; border:none; color:var(--mut,#9aa3b2); padding:10px 4px; font-weight:800; text-align:left; font-family:inherit; }
  .grp-lock { margin-left:auto; font-size:11px; font-weight:700; letter-spacing:.03em; white-space:nowrap; }
  .art.locked-tile { opacity:.45; filter:grayscale(1); cursor:default; }
  .setup-cta { background:linear-gradient(180deg,var(--purplebg,#1c1830),#14101f); border:1.5px solid var(--purpleln,#5b4b8a); border-radius:14px; padding:16px 18px; margin:12px 0 8px; line-height:1.55; animation:setupPulse 1.7s ease-in-out infinite; }
  .setup-cta-row { display:flex; gap:12px; align-items:flex-start; }
  .setup-cta-row b { color:var(--fg,#fff); }
  .setup-cta-btns { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .setup-cta-go { animation:setupFlash 1.4s ease-in-out infinite; }
  @keyframes setupPulse { 0%,100%{ box-shadow:0 0 0 0 rgba(139,127,240,.4);} 50%{ box-shadow:0 0 22px 2px rgba(139,127,240,.55);} }
  @keyframes setupFlash { 0%,100%{ filter:brightness(1);} 50%{ filter:brightness(1.28);} }
  @media (prefers-reduced-motion: reduce){ .setup-cta, .setup-cta-go { animation:none; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- Source-of-data ribbon (built from the registry's source tags) -->
  <div class="verbar" id="verbar"></div>

  <!-- Global AI employee — pinned at the top -->
  <button class="tarsbtn" id="tars-btn" type="button"></button>

  <!-- Header (tenant title + when) -->
  <div class="head" id="head"></div>

  <!-- AI summary (static for v1 — honest, not a live model call) -->
  <div class="ai" id="ai-summary"></div>

  <!-- (Live · updated · REFRESH moved up into the top ribbon #verbar) -->

  <!-- Home — all groups + tiles render here from config/layers.json -->
  <main id="home" aria-live="polite"></main>

  <div class="foot" id="foot"></div>
</div>

<!-- Drill-in overlay (artifact of the same name loads here) -->
<div class="ov" id="ov"><div class="panel" id="panel"></div></div>

<!-- Global TARS chat overlay -->
<div class="ov" id="gov"><div class="panel" id="gpanel" style="min-height:auto"></div></div>

</html>
