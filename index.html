<script>
  /* Password-recovery redirect guard: Supabase's default Site URL redirect lands recovery
     outcomes on the site ROOT as a URL hash. Forward them (hash preserved) to the dedicated
     /reset-password/ handler before the app boots, so a recovery link — VALID or EXPIRED — never
     dumps the user onto the board. Two cases:
       • valid link  -> #access_token=…&type=recovery   (the reset form)
       • dead link   -> #error=…&error_code=otp_expired… (the honest "expired, request a new one")
     The dead-link hash carries NO type=recovery, so it needs its own match. The redirect target is
     hard-coded (/reset-password/), never a client-supplied value, so this adds no open-redirect
     surface; error_code= is a GoTrue-only param the app itself never routes on. */
  try {
    var _h = (location.hash || '').replace(/^#/, '');
    var _isRecovery = /(?:^|&)type=recovery(?:&|$)/.test(_h);
    var _isAuthErr = /(?:^|&)error_code=/.test(_h) && /(?:^|&)error=/.test(_h);
    if ((_isRecovery || _isAuthErr) && !/\/reset-password\/?$/.test(location.pathname)) {
      location.replace('/reset-password/' + location.hash);
    }
  } catch (e) {}
</script>

  .area-emp-btn:hover { background:rgba(139,127,240,.16); }
